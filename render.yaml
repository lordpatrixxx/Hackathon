services:
  - type: web
    name: finance-rag
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: VECTOR_DB_DIR
        value: /tmp/chroma_db
      - key: DATA_DIR
        value: /tmp/data
      - key: COLLECTION_NAME
        value: finance_rag
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_MODEL
        value: nomic-embed-text
      - key: PYTHON_VERSION
        value: "3.11.0"
